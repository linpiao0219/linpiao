<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>一级导航菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        ul {
            list-style: none;
            display: flex;
            background-color: #244b87;
        }
        li a {
            display: block;
            padding: 15px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
        }
        li a:hover {
            background-color: #3b6cb8;
        }
    </style>
</head>
<body>
<ul>
    <li><a href="#">首页</a></li>
    <li><a href="#">教学院(部)</a></li>
    <li><a href="#">党群机构</a></li>
    <li><a href="#">行政教辅机构</a></li>
    <li><a href="#">教学科研</a></li>
    <li><a href="#">招生就业</a></li>
    <li><a href="#">国际交流</a></li>
    <li><a href="#">数字图书馆</a></li>
</ul>
</body>
</html>
