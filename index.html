<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
</head>
<body>
    <!-- 页面头部语义化标签 -->
    <header>
        <h1>用户注册页面</h1>
    </header>

    <!-- 主体区域 -->
    <main>
        <!-- 注册表单，action="#"，method="post" -->
        <form id="regForm" action="#" method="post">
            <fieldset>
                <legend>填写注册信息</legend>

                <p>
                    <label for="username">用户名：</label>
                    <input type="text" name="username" id="username" required>
                </p>

                <p>
                    <label for="password">密码：</label>
                    <input type="password" name="password" id="password" placeholder="6-16位字符">
                </p>

                <p>
                    <label for="confirmPassword">确认密码：</label>
                    <input type="password" name="confirmPassword" id="confirmPassword">
                </p>

                <!-- label两种写法：for+id  和 包裹式 -->
                <p>
                    性别：
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">男</label>

                    <!-- 包裹式label写法 -->
                    <label>
                        <input type="radio" name="gender" value="female">女
                    </label>
                </p>

                <p>
                    <label for="birthday">出生日期：</label>
                    <input type="date" name="birthday" id="birthday">
                </p>

                <p>
                    <label for="email">邮箱：</label>
                    <input type="email" name="email" id="email" required>
                </p>

                <p>
                    <label for="phone">手机号：</label>
                    <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" placeholder="请输入11位手机号">
                </p>

                <p>
                    兴趣爱好：
                    <input type="checkbox" name="hobby" value="reading" id="read">
                    <label for="read">阅读</label>

                    <input type="checkbox" name="hobby" value="sport" id="sport">
                    <label for="sport">运动</label>

                    <input type="checkbox" name="hobby" value="game" id="game">
                    <label for="game">游戏</label>
                </p>

                <p>
                    <label for="avatar">上传头像（支持多选图片）：</label>
                    <input type="file" name="avatar" id="avatar" accept="image/*" multiple>
                </p>

                <p>
                    <label for="city">所在城市：</label>
                    <select name="city" id="city">
                        <option value="changde" selected>常德</option>
                        <option value="changsha">长沙</option>
                        <option value="zhangjiajie">张家界</option>
                    </select>
                </p>

                <p>
                    <label for="bio">个人简介：</label><br>
                    <textarea name="bio" id="bio" rows="4" cols="50"></textarea>
                </p>

                <p>
                    <button type="submit">注册</button>
                    <button type="reset">重置</button>
                </p>
            </fieldset>
        </form>


        <!-- 表格：注册须知，thead、tbody，colspan单元格合并 -->
        <h2>注册须知</h2>
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th colspan="2">注册账号相关说明</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>账号长度</th>
                    <td>用户名3‑20字符</td>
                </tr>
                <tr>
                    <th>密码要求</th>
                    <td>6‑16位字符</td>
                </tr>
            </tbody>
        </table>


        <!-- 列表部分：ul无序列表、ol有序列表、dl定义列表 -->
        <h2>注意事项（无序列表 ul）</h2>
        <ul>
            <li>填写真实邮箱用于找回密码</li>
            <li>手机号必须填写11位数字</li>
            <li>密码不要使用简单数字</li>
        </ul>

        <h2>注册操作步骤（有序列表 ol）</h2>
        <ol>
            <li>填写全部必填信息</li>
            <li>阅读注册须知</li>
            <li>点击注册按钮提交表单</li>
        </ol>

        <h2>常见问题（定义列表 dl）</h2>
        <dl>
            <dt>收不到邮箱验证码？</dt>
            <dd>检查垃圾邮件文件夹</dd>
            <dt>手机号无法通过校验？</dt>
            <dd>确认输入11位纯数字，不要带空格符号</dd>
        </dl>
    </main>

    <!-- 底部语义化标签 -->
    <footer>
        <p>©2026 用户注册系统 版权所有</p>
    </footer>

    <!-- JS监听表单提交，控制台打印表单数据 -->
    <script>
        const form = document.getElementById('regForm');
        form.addEventListener('submit', function(e){
            e.preventDefault(); //阻止页面跳转
            const formData = new FormData(form);
            console.log("====表单提交的数据====");
            for(let [key,val] of formData){
                console.log(key,":",val);
            }
        })
    </script>
</body>
</html>
